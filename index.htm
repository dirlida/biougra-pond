<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#00111a;color:#0f0;font-family:monospace;overflow:hidden}canvas{display:block;width:100%;height:52vh;background:radial-gradient(#002244,#000)}#ui{padding:12px}#uni{border:2px solid #0f0;padding:10px;font-size:13px;line-height:1.4}button{background:#0f0;border:0;padding:14px 20px;margin:5px;font-weight:bold;border-radius:8px;transition:transform 0.1s}button:active{transform:scale(0.9)}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}.pop{animation:pop 0.3s}.ripple{position:absolute;width:20px;height:20px;background:rgba(0,255,0,0.6);border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:rip 0.6s ease-out}@keyframes rip{to{transform:translate(-50%,-50%) scale(12);opacity:0}}#log{max-height:18vh;overflow:auto;font-size:11px;margin-top:8px}</style></head><body><canvas id=pond></canvas><div id=ui><h3 style="margin:4px 0">BIOUGRA POND v16 MINT UX</h3><div id=uni>loading</div><div id=btcinfo style="color:#888;font-size:11px"></div><div><button id=mintBtn onclick="mintZero(event)">MINT ZERO +1 ✨</button><button onclick="saveVault()" style="background:#ff0">SAVE</button><input type=file id=fileLoad accept=.json style="width:110px"><button onclick="loadVault()" style="background:#0ff">LOAD</button></div><div id=log></div></div><script>let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||("wakha-"+Date.now());localStorage.setItem("pond_genesis",genesisId);let realBtc=83724;let _a={btc:realBtc,sun:0,you:0};let audioCtx;function tickSound(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.25);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.25)}catch(e){}}function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length}function drawPond(){let c=document.getElementById("pond");let ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.clearRect(0,0,c.width,c.height);let grad=ctx.createRadialGradient(c.width/2,c.height/2,10,c.width/2,c.height/2,c.width*0.5);grad.addColorStop(0,"#0a5");grad.addColorStop(1,"#001");ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(c.width/2,c.height/2,c.width*0.42,c.height*0.36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold "+(c.width*0.04)+"px monospace";ctx.textAlign="center";ctx.fillText(genesisId.slice(-6),c.width/2,c.height/2+10);for(let i=0;i<personalCount;i++){let ang=(i/Math.max(1,personalCount))*Math.PI*2+Date.now()*0.0003;let x=c.width/2+Math.cos(ang)*c.width*0.27;let y=c.height/2+Math.sin(ang)*c.height*0.22;ctx.fillStyle="#ffeb3b";ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(x+4,y-2,3,0,Math.PI*2);ctx.fill()}}function refreshUni(){let now=new Date();let utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;_a.sun=Math.floor(utcH*1000);_a.you=personalCount;_a.btc=realBtc;let uni=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerHTML="UNI:"+uni+"<br>BTC:"+_a.btc+" SUN:"+_a.sun+" ("+utcH.toFixed(3)+"h UTC)<br>YOU:"+_a.you+" CH:"+chain.length+" ID:"+genesisId.slice(-6)}async function fetchBtc(){try{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();realBtc=Math.floor(parseFloat(j.data.amount));document.getElementById("btcinfo").innerText="LIVE BTC:"+realBtc+" "+new Date().toLocaleTimeString();refreshUni()}catch(e){}}function mintZero(e){tickSound();let btn=document.getElementById("mintBtn");btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop");if(e){let rip=document.createElement("div");rip.className="ripple";rip.style.left=e.clientX+"px";rip.style.top=e.clientY+"px";document.body.appendChild(rip);setTimeout(()=>rip.remove(),600)}personalCount++;localStorage.setItem("pond_personal",personalCount);let id="zero-"+Date.now();let tx={id:id,you:personalCount,btc:_a.btc,sun:_a.sun,ts:Date.now(),uni:_a.btc*1000+_a.sun+personalCount*10};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();let log=document.getElementById("log");log.innerHTML="<div style=color:#0f0>✨ + "+id+" YOU="+personalCount+" UNI="+tx.uni+"</div>"+log.innerHTML;saveVault(true)}function saveVault(silent){let v={genesis:genesisId,personalCount:personalCount,chain:chain};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);if(!silent){let a=document.createElement("a");a.href=u;a.download="chain.json";a.click()}else{localStorage.setItem("pond_vault_backup",JSON.stringify(v))}}function loadVault(){let f=document.getElementById("fileLoad").files[0];if(!f){alert("pick chain.json");return}let r=new FileReader();r.onload=function(){try{let v=JSON.parse(r.result);chain=v.chain||[];personalCount=v.personalCount||chain.length;genesisId=v.genesis||genesisId;localStorage.setItem("pond_chain",JSON.stringify(chain));localStorage.setItem("pond_personal",personalCount);localStorage.setItem("pond_genesis",genesisId);refreshUni();document.getElementById("log").innerHTML="<div style=color:#0ff>LOADED "+chain.length+"</div>"+document.getElementById("log").innerHTML}catch(e){alert("bad json "+e)}};r.readAsText(f)}loadLocal();refreshUni();fetchBtc();setInterval(refreshUni,1000);setInterval(fetchBtc,60000);setInterval(drawPond,40);</script></body></html>
