<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>Biougra v13</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:10px}#universal{border:2px solid #0f0;padding:10px;white-space:pre-line}button{background:#0f0;color:#000;border:0;padding:12px;margin:4px;font-weight:bold}.tx{border:1px solid #0f0;padding:8px;margin:6px 0}</style></head><body><h2>Biougra v13 FIXED</h2><div id=universal>loading...</div><button onclick=mintZero()>MINT ZERO</button><button onclick=saveVaultFile() style=background:#ff0>SAVE VAULT</button><div id=log></div><script>
let chain=[];let personalCount=0;let genesisId="wakha-alik-"+Date.now();let realBtc=113000,realBtcSrc="fallback";let _a={btc:realBtc,sun:0,you:0};let universalBase=0;
async function loadVault(){try{let r=await fetch("./chain.json?v="+Date.now());if(r.ok){let v=await r.json();if(v.chain){chain=v.chain;personalCount=v.personalCount||chain.length;if(v.genesis)genesisId=v.genesis;return;}}}catch(e){}try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length;}
function refreshUniversal(){let d=new Date();let h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;_a.sun=Math.floor(Math.max(0,Math.sin((h-6)*Math.PI/12))*1000000);_a.you=personalCount;_a.btc=realBtc;universalBase=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("universal").innerText="UNIVERSAL: "+universalBase+"
BTC:"+_a.btc+" SUN:"+_a.sun+" YOU:"+_a.you+" CHAIN:"+chain.length;}
function log(m){document.getElementById("log").innerHTML="<div>> "+m+"</div>"+document.getElementById("log").innerHTML}
function render(){document.getElementById("log").innerHTML=chain.slice(-10).reverse().map(x=>"<div class=tx>"+(x.id||"").slice(0,30)+" YOU:"+x.you+"</div>").join("")}
async function fetchRealBtc(){try{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();realBtc=Math.floor(parseFloat(j.data.amount));realBtcSrc="coinbase";}catch(e){}refreshUniversal();}
function mintZero(){personalCount++;localStorage.setItem("pond_personal",personalCount);let id="zero-"+Date.now()+"-"+Math.random().toString(36).slice(2);let tx={id,genesis:genesisId,universal:universalBase,time:new Date().toTimeString().slice(0,8),pond:"BTC:"+_a.btc+" SUN:"+_a.sun+" YOU:"+_a.you,branch:"b"+chain.length,btc:_a.btc,sun:_a.sun,you:_a.you,ts:Date.now()};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUniversal();render();log("MINTED YOU="+personalCount);}
function getVault(){return{genesis:genesisId,personalCount:personalCount,chain:chain,exported_at:new Date().toISOString()};}
function saveVaultFile(){let b=new Blob([JSON.stringify(getVault(),null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click();}
(async()=>{await loadVault();await fetchRealBtc();refreshUniversal();render();})();
<\/script></body></html>
