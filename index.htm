<!DOCTYPE html><html><body style=background:#000;color:#0f0;font-family:monospace;padding:15px><h2>BIOUGRA POND v14</h2><div id=uni style=border:2px solid #0f0;padding:10px;white-space:pre-line>loading...</div><div id=err style=color:#f55></div><button onclick=mintZero() style=background:#0f0;padding:12px;margin:4px>MINT ZERO</button><button onclick=saveVault() style=background:#ff0;padding:12px;margin:4px>SAVE VAULT</button><button onclick=clearPond() style=background:#111;color:#f55;border:1px solid #f55;padding:8px>CLR</button><div id=log></div><script>window.onerror=function(m){document.getElementById("err").innerText=m};let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||("wakha-"+Date.now());localStorage.setItem("pond_genesis",genesisId);let realBtc=113500;let _a={btc:realBtc,sun:0,you:0};let uniBase=0;function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length}function refreshUni(){let d=new Date();let h=d.getUTCHours()+d.getUTCMinutes()/60;_a.sun=Math.floor(h*1000);_a.you=personalCount;_a.btc=realBtc;uniBase=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerText="UNIVERSAL: "+uniBase+"

ID:"+genesisId}function mintZero(){personalCount++;localStorage.setItem("pond_personal",personalCount);let id="zero-"+Date.now()+"-"+Math.random().toString(36).slice(2,5);let tx={id:id,you:personalCount,pond:"BTC:"+_a.btc+" SUN:"+_a.sun+" YOU:"+_a.you,btc:_a.btc,sun:_a.sun,ts:Date.now()};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();document.getElementById("log").innerHTML="<div>MINTED "+id+" YOU="+personalCount+"</div>"+document.getElementById("log").innerHTML}function saveVault(){let v={genesis:genesisId,personalCount:personalCount,chain:chain,exported_at:new Date().toISOString()};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click()}function clearPond(){if(!confirm("clear?"))return;chain=[];personalCount=0;localStorage.setItem("pond_chain","[]");localStorage.setItem("pond_personal","0");refreshUni()}loadLocal();refreshUni();</script>
