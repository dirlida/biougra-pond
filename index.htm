<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#00111a;color:#0f0;font-family:monospace}canvas{display:block;width:100%;height:35vh}#ui{padding:10px}#uni{border:2px solid #0f0;padding:10px;font-size:12px}button{background:#0f0;border:0;padding:10px 14px;margin:4px;font-weight:bold;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:9px}th,td{border:1px solid #0a0;padding:3px}th{background:#0a0;color:#000}#chainBox{max-height:30vh;overflow:auto;border:1px solid #0a0}</style></head><body><canvas id=pond></canvas><div id=ui><h3>BIOUGRA POND v18 AUTO-SYNC</h3><div id=uni></div><div id=status style="color:#ff0;font-size:10px"></div><div><button onclick="mintZero()">MINT ZERO +1 ✨</button><button onclick="saveVault()" style="background:#ff0">SAVE</button><button onclick="pushVault()" style="background:#0ff">SYNC TO GITHUB</button><input type=file id=fileLoad style="width:90px"><button onclick="loadVault()" style="background:#888">LOAD</button></div><div id=chainBox><table id=chainTable><thead><tr><th>#</th><th>ID</th><th>YOU</th><th>BTC</th><th>UNI</th><th>OK</th></tr></thead><tbody></tbody></table></div></div><script>
let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||"wakha-019487";localStorage.setItem("pond_genesis",genesisId);let realBtc=83934;let _a={btc:realBtc,sun:0,you:0};
async function tryAutoSync(){document.getElementById("status").innerText="syncing...";try{let r=await fetch("./chain.json?"+Date.now());if(r.ok){let v=await r.json();if(v.chain && v.chain.length>chain.length){chain=v.chain;personalCount=v.personalCount;genesisId=v.genesis;localStorage.setItem("pond_chain",JSON.stringify(chain));localStorage.setItem("pond_personal",personalCount);document.getElementById("status").innerText="auto-sync: "+chain.length+" fish from github ✅";refreshUni();renderChain();return;}} }catch(e){}document.getElementById("status").innerText="local: "+chain.length+" fish (offline ok)";}
function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length;chain.forEach(function(t){if(t.btc===undefined||t.sun===undefined||isNaN(t.uni)||t.uni==null){t.btc=t.btc||113500;t.sun=t.sun||13216;t.uni=t.btc*1000+t.sun+t.you*10}});if(chain.length) localStorage.setItem("pond_chain",JSON.stringify(chain))}
function drawPond(){let c=document.getElementById("pond");let ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#0a4";ctx.beginPath();ctx.ellipse(c.width/2,c.height/2,c.width*0.42,c.height*0.36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold "+(c.width*0.04)+"px monospace";ctx.textAlign="center";ctx.fillText(genesisId.slice(-6),c.width/2,c.height/2+10);for(let i=0;i<personalCount;i++){let ang=(i/Math.max(1,personalCount))*Math.PI*2+Date.now()*0.0003;let x=c.width/2+Math.cos(ang)*c.width*0.27;let y=c.height/2+Math.sin(ang)*c.height*0.22;ctx.fillStyle="#ffeb3b";ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill()}}
function refreshUni(){let now=new Date();let utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;_a.sun=Math.floor(utcH*1000);_a.you=personalCount;let uni=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerHTML="UNI:"+uni+"<br>BTC:"+_a.btc+" SUN:"+_a.sun+" YOU:"+_a.you+" CH:"+chain.length}
async function fetchBtc(){try{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();realBtc=Math.floor(parseFloat(j.data.amount));refreshUni()}catch(e){}}
function renderChain(){let tb=document.querySelector("#chainTable tbody");tb.innerHTML="";chain.forEach(function(tx,idx){let calc=tx.btc*1000+tx.sun+tx.you*10;let ok=calc==tx.uni?"OK":"BAD";let tr=document.createElement("tr");tr.innerHTML="<td>"+(idx+1)+"</td><td>"+tx.id.slice(-6)+"</td><td>"+tx.you+"</td><td>"+tx.btc+"</td><td>"+tx.uni+"</td><td>"+ok+"</td>";tb.appendChild(tr)})}
function mintZero(){personalCount++;localStorage.setItem("pond_personal",personalCount);let uni=_a.btc*1000+_a.sun+personalCount*10;let tx={id:"zero-"+Date.now(),you:personalCount,btc:_a.btc,sun:_a.sun,ts:Date.now(),uni:uni};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();renderChain();saveVaultFile();}
function saveVaultFile(){let v={genesis:genesisId,personalCount:personalCount,chain:chain};localStorage.setItem("pond_vault_pending",JSON.stringify(v));}
function saveVault(){let v={genesis:genesisId,personalCount:personalCount,chain:chain};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click();document.getElementById("status").innerText="saved chain.json - now git push it";}
function pushVault(){document.getElementById("status").innerText="to sync: in termux do: cat > chain.json << 'JSON' + (localStorage.pond_chain)... then git push - I will automate in v19"; saveVault();}
function loadVault(){let f=document.getElementById("fileLoad").files[0];if(!f)return;let r=new FileReader();r.onload=function(){let v=JSON.parse(r.result);chain=v.chain||[];personalCount=v.personalCount||chain.length;genesisId=v.genesis||genesisId;localStorage.setItem("pond_chain",JSON.stringify(chain));localStorage.setItem("pond_personal",personalCount);localStorage.setItem("pond_genesis",genesisId);location.reload()};r.readAsText(f)}
loadLocal();refreshUni();fetchBtc();renderChain();tryAutoSync();setInterval(refreshUni,1000);setInterval(fetchBtc,60000);setInterval(drawPond,60);
</script></body></html>
