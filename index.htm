<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#00111a;color:#0f0;font-family:monospace}canvas{display:block;width:100%;height:55vh;background:radial-gradient(#003, #000)}#ui{padding:12px}#uni{border:2px solid #0f0;padding:8px;font-size:14px}button{background:#0f0;border:0;padding:14px 20px;margin:6px;font-weight:bold}</style></head><body><canvas id=pond></canvas><div id=ui><h3>BIOUGRA POND v15 VISUAL</h3><div id=uni>loading</div><div id=btcinfo style="color:#888;font-size:11px"></div><button onclick="mintZero()">MINT ZERO +1</button><button onclick="saveVault()" style="background:#ff0">SAVE VAULT</button><div id=log style="max-height:20vh;overflow:auto"></div></div><script>let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||("wakha-"+Date.now());localStorage.setItem("pond_genesis",genesisId);let realBtc=84324;let _a={btc:realBtc,sun:0,you:0};function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length}function drawPond(){let c=document.getElementById("pond");let ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#0a4";ctx.beginPath();ctx.ellipse(c.width/2,c.height/2,c.width*0.4,c.height*0.35,0,0,Math.PI*2);ctx.fill();for(let i=0;i<personalCount;i++){let ang=(i/personalCount)*Math.PI*2+Date.now()*0.0002;let x=c.width/2+Math.cos(ang)*c.width*0.25;let y=c.height/2+Math.sin(ang)*c.height*0.2;ctx.fillStyle="#ff0";ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill()}}function refreshUni(){let now=new Date();let utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;_a.sun=Math.floor(utcH*1000);_a.you=personalCount;_a.btc=realBtc;let uni=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerHTML="UNI:"+uni+"<br>BTC:"+_a.btc+" SUN_UTC:"+_a.sun+" ("+utcH.toFixed(3)+"h)<br>YOU:"+_a.you+" CH:"+chain.length+" ID:"+genesisId.slice(-6);drawPond()}async function fetchBtc(){try{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();realBtc=Math.floor(parseFloat(j.data.amount));document.getElementById("btcinfo").innerText="LIVE BTC:"+realBtc+" "+new Date().toLocaleTimeString();refreshUni()}catch(e){}}function mintZero(){personalCount++;localStorage.setItem("pond_personal",personalCount);let id="zero-"+Date.now();let tx={id:id,you:personalCount,btc:_a.btc,sun:_a.sun,ts:Date.now()};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();document.getElementById("log").innerHTML="<div>+ "+id+" YOU="+personalCount+"</div>"+document.getElementById("log").innerHTML}function saveVault(){let v={genesis:genesisId,personalCount:personalCount,chain:chain};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click()}loadLocal();refreshUni();fetchBtc();setInterval(refreshUni,1000);setInterval(fetchBtc,60000);setInterval(drawPond,50);</script></body></html>
