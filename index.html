<!DOCTYPE html><html><body style=background:#000;color:#0f0;font-family:monospace;padding:15px><h2>BIOUGRA v14.2 DUAL SUN</h2><div id=uni style=border:2px solid #0f0;padding:10px>loading...</div><div id=err style=color:#f55></div><div id=btcinfo style=color:#888;font-size:12px></div><button onclick=mintZero() style=background:#0f0;padding:12px;margin:4px>MINT ZERO</button><button onclick=saveVault() style=background:#ff0;padding:12px;margin:4px>SAVE VAULT</button><div id=log></div><script>window.onerror=function(m){document.getElementById("err").innerText=m};let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||("wakha-"+Date.now());localStorage.setItem("pond_genesis",genesisId);let realBtc=85145;let _a={btc:realBtc,sun:0,sunLocal:0,you:0};function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length}function refreshUni(){let now=new Date();let utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;let localH=now.getHours()+now.getMinutes()/60;let agadirStr=now.toLocaleString("en-US",{timeZone:"Africa/Casablanca",hour12:false,hour:"numeric",minute:"numeric"});let parts=agadirStr.split(":");let agadirH=parseInt(parts[0])+parseInt(parts[1])/60;_a.sun=Math.floor(utcH*1000);_a.sunLocal=Math.floor(agadirH*1000);_a.you=personalCount;_a.btc=realBtc;let uniBase=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerHTML="UNI:"+uniBase+"<br>BTC:"+_a.btc+" SUN_UTC:"+_a.sun+" ("+utcH.toFixed(2)+"h)<br>SUN_AGADIR:"+_a.sunLocal+" ("+agadirStr+" Africa/Casablanca)<br>YOU:"+_a.you+" CH:"+chain.length+"<br>ID:"+genesisId}async function fetchBtc(){try{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();realBtc=Math.floor(parseFloat(j.data.amount));document.getElementById("btcinfo").innerText="LIVE BTC:"+realBtc+" updated "+new Date().toLocaleTimeString();refreshUni()}catch(e){document.getElementById("btcinfo").innerText="BTC fetch fail, using "+realBtc}}function mintZero(){personalCount++;localStorage.setItem("pond_personal",personalCount);let id="zero-"+Date.now();let tx={id:id,you:personalCount,pond:"BTC:"+_a.btc+" SUN:"+_a.sun+" SUN_AG:"+_a.sunLocal+" YOU:"+_a.you,btc:_a.btc,sun:_a.sun,sunLocal:_a.sunLocal,ts:Date.now()};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();document.getElementById("log").innerHTML="<div>MINTED "+id+" YOU="+personalCount+"</div>"+document.getElementById("log").innerHTML}function saveVault(){let v={genesis:genesisId,personalCount:personalCount,chain:chain};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click()}loadLocal();refreshUni();fetchBtc();setInterval(()=>{refreshUni()},1000);setInterval(fetchBtc,60000);</script>
