<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>v14 debug</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:12px}#uni{border:2px solid #0f0;padding:10px;white-space:pre-line}button{background:#0f0;color:#000;padding:12px;margin:4px;font-weight:bold}</style></head><body>
<h2>Biougra v14 debug</h2>
<div id=uni>starting...</div>
<div id=err style=color:#f55></div>
<button onclick=mintZero()>MINT ZERO</button>
<button onclick=saveVault() style=background:#ff0>SAVE VAULT</button>
<div id=log></div>
<script>
function showErr(e){document.getElementById('err').innerText='ERROR: '+e.message+'
'+e.stack}
window.onerror=function(m,s,l,c,er){showErr(er||{message:m});}
try{
let chain=[];let personalCount=0;
let genesisId=localStorage.getItem('pond_genesis')||('wakha-'+Date.now());
localStorage.setItem('pond_genesis',genesisId);
let realBtc=113500;let realBtcSrc='fallback';
let _a={btc:realBtc,sun:0,you:0};let uniBase=0;
function loadLocal(){try{chain=JSON.parse(localStorage.getItem('pond_chain')||'[]')}catch(e){chain=[]} personalCount=parseInt(localStorage.getItem('pond_personal')||'0')||chain.length;}
function refreshUni(){
  let d=new Date();let h=d.getUTCHours()+d.getUTCMinutes()/60;
  _a.sun=Math.floor(h*1000);_a.you=personalCount;_a.btc=realBtc;uniBase=_a.btc*1000+_a.sun+_a.you*10;
  document.getElementById('uni').innerText='UNIVERSAL: '+uniBase+'
BTC:'+_a.btc+' SUN:'+_a.sun+' YOU:'+_a.you+' CHAIN:'+chain.length+'
ID:'+genesisId;
}
function mintZero(){
  personalCount++;localStorage.setItem('pond_personal',personalCount);
  let id='zero-'+Date.now();let tx={id:id,you:personalCount,pond:'BTC:'+_a.btc+' SUN:'+_a.sun+' YOU:'+_a.you,btc:_a.btc,sun:_a.sun,ts:Date.now()};
  chain.push(tx);localStorage.setItem('pond_chain',JSON.stringify(chain));refreshUni();
  document.getElementById('log').innerHTML='<div>MINTED '+id+'</div>'+document.getElementById('log').innerHTML;
}
function saveVault(){
  let vault={genesis:genesisId,personalCount:personalCount,chain:chain};
  let blob=new Blob([JSON.stringify(vault,null,2)],{type:'application/json'});
  let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='chain.json';a.click();
}
loadLocal();refreshUni();
document.getElementById('log').innerHTML+='<div>loaded ok</div>';
}catch(e){showErr(e)}
</script></body></html>
