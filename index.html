<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#00111a;color:#0f0;font-family:monospace}canvas{display:block;width:100%;height:40vh}#ui{padding:10px}#uni{border:2px solid #0f0;padding:10px;font-size:12px}button{background:#0f0;border:0;padding:12px 16px;margin:4px;font-weight:bold;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #0a0;padding:4px}th{background:#0a0;color:#000}#chainBox{max-height:32vh;overflow:auto;border:1px solid #0a0;margin-top:8px}</style></head><body><canvas id=pond></canvas><div id=ui><h3>BIOUGRA POND v17.1 FIXED</h3><div id=uni></div><div id=btcinfo style="color:#888;font-size:11px"></div><div><button onclick="mintZero()">MINT ZERO +1</button><button onclick="saveVault()" style="background:#ff0">SAVE</button><input type=file id=fileLoad style="width:100px"><button onclick="loadVault()" style="background:#0ff">LOAD</button></div><div id=chainBox><table id=chainTable><thead><tr><th>#</th><th>ID</th><th>YOU</th><th>BTC</th><th>SUN</th><th>UNI</th><th>OK?</th></tr></thead><tbody></tbody></table></div></div><script>let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||"wakha-019487";localStorage.setItem("pond_genesis",genesisId);let realBtc=83934;let _a={btc:realBtc,sun:0,you:0};function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length;let fixed=false;chain.forEach(function(t){if(t.btc===undefined||t.sun===undefined||isNaN(t.uni)||t.uni==null){t.btc=t.btc||113500;t.sun=t.sun||13216;t.uni=t.btc*1000+t.sun+t.you*10;fixed=true}});if(fixed){localStorage.setItem("pond_chain",JSON.stringify(chain))}}function drawPond(){let c=document.getElementById("pond");let ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.fillStyle="#0a4";ctx.beginPath();ctx.ellipse(c.width/2,c.height/2,c.width*0.42,c.height*0.36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold "+(c.width*0.04)+"px monospace";ctx.textAlign="center";ctx.fillText(genesisId.slice(-6),c.width/2,c.height/2+10);for(let i=0;i<personalCount;i++){let ang=(i/Math.max(1,personalCount))*Math.PI*2+Date.now()*0.0003;let x=c.width/2+Math.cos(ang)*c.width*0.27;let y=c.height/2+Math.sin(ang)*c.height*0.22;ctx.fillStyle="#ffeb3b";ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill()}}function refreshUni(){let now=new Date();let utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;_a.sun=Math.floor(utcH*1000);_a.you=personalCount;_a.btc=realBtc;let uni=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerHTML="UNI:"+uni+"<br>BTC:"+_a.btc+" SUN:"+_a.sun+" YOU:"+_a.you+" CH:"+chain.length+" ID:"+genesisId.slice(-6)}function renderChain(){let tb=document.querySelector("#chainTable tbody");tb.innerHTML="";chain.forEach(function(tx,idx){let calc=tx.btc*1000+tx.sun+tx.you*10;let ok=calc==tx.uni?"OK":"BAD";let tr=document.createElement("tr");tr.innerHTML="<td>"+(idx+1)+"</td><td>"+tx.id.slice(-6)+"</td><td>"+tx.you+"</td><td>"+tx.btc+"</td><td>"+tx.sun+"</td><td>"+tx.uni+"</td><td>"+ok+"</td>";tb.appendChild(tr)})}function mintZero(){personalCount++;localStorage.setItem("pond_personal",personalCount);let uni=_a.btc*1000+_a.sun+personalCount*10;let tx={id:"zero-"+Date.now(),you:personalCount,btc:_a.btc,sun:_a.sun,ts:Date.now(),uni:uni};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();renderChain()}function saveVault(){let v={genesis:genesisId,personalCount:personalCount,chain:chain};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click()}function loadVault(){let f=document.getElementById("fileLoad").files[0];if(!f)return alert("pick");let r=new FileReader();r.onload=function(){let v=JSON.parse(r.result);chain=v.chain||[];personalCount=v.personalCount||chain.length;genesisId=v.genesis||genesisId;localStorage.setItem("pond_chain",JSON.stringify(chain));localStorage.setItem("pond_personal",personalCount);localStorage.setItem("pond_genesis",genesisId);location.reload()};r.readAsText(f)}loadLocal();refreshUni();renderChain();setInterval(refreshUni,1000);setInterval(drawPond,50);</script></body></html>
