<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biougra Pond v22 Merged</title>
<style>
body{background:#000e14;color:#0f3;font-family:monospace;padding:12px}
#market-bar{display:flex;flex-wrap:wrap;gap:12px;padding:10px;border:1px solid #0f3;background:#001a22;margin-bottom:12px}
#moon-bar{display:flex;gap:12px;padding:8px;border:1px dashed #f0f;background:#1a002a}
button{background:#0f3;color:#001a12;border:none;padding:8px 14px;font-weight:bold;cursor:pointer;margin:4px}
button.gps{background:#0ff}
#chain{max-height:180px;overflow:auto;border:1px solid #0f3;padding:8px;margin-top:12px}
.fish{padding:2px 0;border-bottom:1px dotted #0f3}
#gpsBox{border:1px solid #0ff;padding:8px;margin-top:12px;color:#0ff;max-height:220px;overflow:auto}
small{color:#8f8}
</style>
</head>
<body>
<div id="market-bar"><span>🌊 POND://biougra v22</span><span id="ocean">...</span><span id="you-count">...</span><button id="copyPond">Copy Link</button><button onclick="localStorage.removeItem('gh_token');location.reload()">Reset Token</button></div>
<div id="moon-bar"><span id="sun-real">SUN:...</span><span id="moon-real">MOON:...</span><span id="btc-real">BTC:...</span></div>
<h2>Biougra Pond v22 - Fish + GPS Privacy 2dec+hash</h2>
<canvas id="pond" width="360" height="220" style="border:1px solid #0f3;background:#001822;margin:12px 0"></canvas><br>
<button id="mint">MINT YOU FISH 🎣</button>
<button id="mintGPS" class="gps">MINT GPS BLOCK 📍 (browser)</button>
<small> Termux:./mint-auto.sh = real phone GPS, private log stays on phone</small>
<div id="gpsBox">GPS blocks: loading...</div>
<div id="chain"></div>
<script>
const REPO="dirlida/biougra-pond"; const FILE_PATH="chain.json";
let GH_TOKEN=localStorage.getItem('gh_token');
if(!GH_TOKEN){GH_TOKEN=prompt("Paste ghp token (once):"); if(GH_TOKEN) localStorage.setItem('gh_token',GH_TOKEN.trim());}
async function pushDirect(chainObj){
  const contentStr=JSON.stringify(chainObj,null,2);
  const b64=btoa(unescape(encodeURIComponent(contentStr)));
  let sha=null; try{ const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`,{headers:{Authorization:`token ${GH_TOKEN}`}}); const j=await r.json(); sha=j.sha; }catch(e){}
  const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`,{method:"PUT",headers:{Authorization:`token ${GH_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({message:`pond ${chainObj.personalCount} blocks ${(chainObj.blocks||[]).length} ${new Date().toISOString()}`,content:b64,sha})});
  const out=await res.json(); if(out.content) alert("Pushed!"); else alert("Fail: "+JSON.stringify(out).slice(0,400));
}
const GENESIS="wakha-1790774019487"; const RAW="https://raw.githubusercontent.com/dirlida/biougra-pond/main/chain.json"; const LAT=30.4278,LON=-9.5981;
function getSunCycle(){const now=new Date();const start=new Date(now.getFullYear(),0,0);const day=Math.floor((now-start)/86400000);const decl=23.45*Math.sin((360/365)*(284+day)*Math.PI/180);const latRad=LAT*Math.PI/180;const cosH=-Math.tan(latRad)*Math.tan(decl*Math.PI/180);const H=Math.acos(Math.min(1,Math.max(-1,cosH)))*180/Math.PI;const sunrise=12-H/15-LON/15;const sunset=12+H/15-LON/15;const curH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;let prog;if(curH<sunrise)prog=0;else if(curH>sunset)prog=1;else prog=(curH-sunrise)/(sunset-sunrise);let kelvin=0;if(prog>0&&prog<1){const noonDist=Math.abs(prog-0.5)*2;kelvin=Math.floor(2000+(4500)*(1-noonDist));}const sunInt=Math.floor(prog*16000);return{sun:kelvin,sunProg:sunInt,prog,sunrise:sunrise.toFixed(2),sunset:sunset.toFixed(2),day};}
function getMoon(){const knownNew=new Date('2024-01-11T11:57:00Z').getTime();const cycle=29.53058867*86400000;const now=Date.now();const phase=((now-knownNew)%cycle)/cycle;const age=Math.floor(phase*29.53);let name="🌑 New";if(phase<0.125)name="🌑 New";else if(phase<0.25)name="🌒 Waxing Crescent";else if(phase<0.375)name="🌓 First Quarter";else if(phase<0.5)name="🌔 Waxing Gibbous";else if(phase<0.625)name="🌕 Full";else if(phase<0.75)name="🌖 Waning Gibbous";else if(phase<0.875)name="🌗 Last Quarter";else name="🌘 Waning Crescent";const moonVal=Math.floor(phase*16000);return{moon:moonVal,age,name,phase:phase.toFixed(3)};}
async function sha8(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8);}
async function loadChain(){try{const r=await fetch(RAW+"?v="+Date.now());const t=await r.text();if(t.includes('}{'))throw new Error('corrupt');const j=JSON.parse(t);return j;}catch(e){const l=localStorage.getItem('wakha-chain');if(l)return JSON.parse(l);return{genesis:GENESIS,personalCount:0,chain:[],blocks:[]};}}
function saveChain(o){const txt=JSON.stringify(o,null,2);if(txt.includes('}{')){alert('blocked');return;}localStorage.setItem('wakha-chain',txt);pushDirect(o);}
let state;async function init(){state=await loadChain();if(!state.blocks)state.blocks=[];if(!state.chain)state.chain=[];if(!state.personalCount)state.personalCount=state.blocks.length;document.getElementById('you-count').textContent='You: '+state.personalCount;document.getElementById('ocean').textContent='Ocean: '+state.chain.length+' fish | GPS: '+state.blocks.length+' blocks';render();renderGPS();async function tick(){const s=getSunCycle();const m=getMoon();document.getElementById('sun-real').textContent=`SUN:${s.sun}K prog:${s.sunProg} rise:${s.sunrise} set:${s.sunset}`;document.getElementById('moon-real').textContent=`${m.name} ${m.moon} age:${m.age}d`;try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');const j=await r.json();document.getElementById('btc-real').textContent='BTC:'+j.bitcoin.usd;window._btc=j.bitcoin.usd;}catch{document.getElementById('btc-real').textContent='BTC:'+(window._btc||83934);}drawPond(s,m);}tick();setInterval(tick,10000);}
function render(){const c=document.getElementById('chain');c.innerHTML=state.chain.slice(-20).reverse().map(f=>`<div class="fish">#${f.you} ${f.id} btc:${f.btc} sun:${f.sun}K moon:${f.moon||0} ${f.moonName||''}</div>`).join('');}
function renderGPS(){const box=document.getElementById('gpsBox');const blocks=state.blocks||[];if(!blocks.length){box.textContent='No GPS blocks yet. Run./mint-auto.sh in Termux';return;}box.innerHTML=blocks.slice(-20).reverse().map(b=>{const lat=(b.lat||30.13).toFixed?b.lat.toFixed(2):b.lat;const lon=(b.lon||-9.38).toFixed?b.lon.toFixed(2):b.lon;return `#${b.you} ${b.city||'Tinkourri'} [${lat},${lon}] #${b.hash||'nohash'} btc:${b.btc} 🌅${b.sunrise} 🌇${b.sunset} ${b.moon||''} <small>priv:${b.privacy||'2dec+hash'}</small>`;}).join('<br>');}
function drawPond(s,m){const cv=document.getElementById('pond');const ctx=cv.getContext('2d');ctx.clearRect(0,0,360,220);const bright=Math.max(0,Math.min(1,s.prog));ctx.fillStyle=`rgb(${20+bright*100},${30+bright*80},${60+bright*100})`;ctx.fillRect(0,0,360,120);ctx.fillStyle=`rgb(${255},${Math.floor(200+bright*55)},${Math.floor(50+bright*100)})`;ctx.beginPath();ctx.arc(20+s.prog*320,100-bright*60,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(300,40,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000e14';ctx.beginPath();ctx.arc(300+(parseFloat(m.phase)-0.5)*12,40,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#003322';ctx.fillRect(0,120,360,100);ctx.fillStyle='#0f3';state.chain.slice(-30).forEach((f,i)=>{ctx.fillRect(10+(i*11)%340,130+Math.random()*70,4,2);});ctx.fillStyle='#0ff';ctx.fillText(`Pond fish: ${state.chain.length} GPS:${state.blocks.length} Sun:${s.sun}K Moon:${m.name}`,10,210);}
document.getElementById('mint').onclick=()=>{const s=getSunCycle();const m=getMoon();const fish={id:'zero-'+Date.now(),you:state.personalCount+1,ts:Date.now(),btc:window._btc||83934,sun:s.sun,sunProg:s.sunProg,moon:m.moon,moonName:m.name,sunrise:s.sunrise,sunset:s.sunset};state.chain.push(fish);state.personalCount++;saveChain(state);render();document.getElementById('you-count').textContent='You: '+state.personalCount;document.getElementById('ocean').textContent='Ocean: '+state.chain.length+' fish | GPS: '+state.blocks.length+' blocks';};
document.getElementById('mintGPS').onclick=async()=>{let lat,lon;if(navigator.geolocation){try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:8000}));lat=pos.coords.latitude;lon=pos.coords.longitude;}catch(e){const coords=prompt("GPS denied. Paste lat,lon:");if(!coords)return;lat=parseFloat(coords.split(',')[0]);lon=parseFloat(coords.split(',')[1]);}}else{const coords=prompt("Paste lat,lon:");if(!coords)return;lat=parseFloat(coords.split(',')[0]);lon=parseFloat(coords.split(',')[1]);}const latPub=lat.toFixed(2);const lonPub=lon.toFixed(2);const h=await sha8(lat.toFixed(6)+','+lon.toFixed(6)+Date.now());let city="Tinkourri";try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);const j=await r.json();city=j.address.village||j.address.town||j.address.city||"Tinkourri";}catch{}const s=getSunCycle();const btc=window._btc||83934;const block={you:(state.blocks.length||0)+1,city,lat:parseFloat(latPub),lon:parseFloat(lonPub),hash:h,privacy:"2dec+hash",btc,sunrise:s.sunrise,sunset:s.sunset,moon:getMoon().name,ts:Date.now()/1000};state.blocks.push(block);state.personalCount=state.blocks.length;saveChain(state);renderGPS();alert(`GPS sealed ${city} [${latPub},${lonPub}]#${h} - precise NOT uploaded`);};
document.getElementById('copyPond').onclick=()=>{navigator.clipboard.writeText(location.href.split('?')[0]+'?pond=biougra&genesis='+GENESIS);alert('pond link copied');};
init();
</script>
</body>
</html>
