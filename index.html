<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#00111a;color:#0f0;font-family:monospace}canvas{display:block;width:100%;height:45vh;background:radial-gradient(#002244,#000)}#ui{padding:10px}#uni{border:2px solid #0f0;padding:10px;font-size:12px}button{background:#0f0;border:0;padding:12px 16px;margin:4px;font-weight:bold;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:10px;margin-top:8px}th,td{border:1px solid #0a0;padding:4px;text-align:left}th{background:#0a0;color:#000}#chainBox{max-height:30vh;overflow:auto;border:1px solid #0a0;margin-top:8px}</style></head><body><canvas id=pond></canvas><div id=ui><h3 style="margin:4px 0">BIOUGRA POND v17 CHAIN VIEWER</h3><div id=uni>loading</div><div id=btcinfo style="color:#888;font-size:11px"></div><div><button id=mintBtn onclick="mintZero(event)">MINT ZERO +1 ✨</button><button onclick="saveVault()" style="background:#ff0">SAVE</button><input type=file id=fileLoad accept=.json style="width:100px"><button onclick="loadVault()" style="background:#0ff">LOAD</button><button onclick="toggleChain()" style="background:#f0f">CHAIN</button></div><div id=chainBox style="display:none"><table id=chainTable><thead><tr><th>#</th><th>ID</th><th>YOU</th><th>BTC</th><th>SUN</th><th>UNI</th><th>OK?</th></tr></thead><tbody></tbody></table></div><div id=log style="max-height:10vh;overflow:auto;font-size:11px"></div></div><script>let chain=[];let personalCount=0;let genesisId=localStorage.getItem("pond_genesis")||("wakha-"+Date.now());localStorage.setItem("pond_genesis",genesisId);let realBtc=83857;let _a={btc:realBtc,sun:0,you:0};let audioCtx;function tickSound(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.25);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.25)}catch(e){}}function loadLocal(){try{chain=JSON.parse(localStorage.getItem("pond_chain")||"[]")}catch(e){chain=[]}personalCount=parseInt(localStorage.getItem("pond_personal")||"0")||chain.length}function drawPond(){let c=document.getElementById("pond");let ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#0a4";ctx.beginPath();ctx.ellipse(c.width/2,c.height/2,c.width*0.42,c.height*0.36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold "+(c.width*0.04)+"px monospace";ctx.textAlign="center";ctx.fillText(genesisId.slice(-6),c.width/2,c.height/2+10);for(let i=0;i<personalCount;i++){let ang=(i/Math.max(1,personalCount))*Math.PI*2+Date.now()*0.0003;let x=c.width/2+Math.cos(ang)*c.width*0.27;let y=c.height/2+Math.sin(ang)*c.height*0.22;ctx.fillStyle="#ffeb3b";ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(x+4,y-2,2.5,0,Math.PI*2);ctx.fill()}}function refreshUni(){let now=new Date();let utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;_a.sun=Math.floor(utcH*1000);_a.you=personalCount;_a.btc=realBtc;let uni=_a.btc*1000+_a.sun+_a.you*10;document.getElementById("uni").innerHTML="UNI:"+uni+"<br>BTC:"+_a.btc+" SUN:"+_a.sun+" ("+utcH.toFixed(3)+"h UTC) YOU:"+_a.you+" CH:"+chain.length+" ID:"+genesisId.slice(-6)}async function fetchBtc(){try{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();realBtc=Math.floor(parseFloat(j.data.amount));document.getElementById("btcinfo").innerText="LIVE BTC:"+realBtc+" "+new Date().toLocaleTimeString();refreshUni()}catch(e){}}function renderChain(){let tb=document.querySelector("#chainTable tbody");tb.innerHTML="";chain.forEach((tx,idx)=>{let calc=tx.btc*1000+tx.sun+tx.you*10;let ok=calc==tx.uni?"✅":"❌";if(!tx.uni){calc=tx.btc*1000+tx.sun+tx.you*10;tx.uni=calc;ok="fix"}let tr=document.createElement("tr");tr.innerHTML="<td>"+ (idx+1)+"</td><td>"+tx.id.slice(-6)+"</td><td>"+tx.you+"</td><td>"+tx.btc+"</td><td>"+tx.sun+"</td><td>"+tx.uni+"</td><td>"+ok+"</td>";tb.appendChild(tr)})}function toggleChain(){let b=document.getElementById("chainBox");b.style.display=b.style.display=="none"?"block":"none";renderChain(); chain.forEach(t=>{if(!t.btc||isNaN(t.uni)){t.btc=t.btc||113500; t.sun=t.sun||13216; t.uni=t.btc*1000+t.sun+t.you*10}}); localStorage.setItem("pond_chain",JSON.stringify(chain));function mintZero(e){tickSound();personalCount++;localStorage.setItem("pond_personal",personalCount);let id="zero-"+Date.now();let uni=_a.btc*1000+_a.sun+personalCount*10;let tx={id:id,you:personalCount,btc:_a.btc,sun:_a.sun,ts:Date.now(),uni:uni};chain.push(tx);localStorage.setItem("pond_chain",JSON.stringify(chain));refreshUni();renderChain();document.getElementById("log").innerHTML="<div>✨ + "+id.slice(-6)+" YOU="+personalCount+"</div>"+document.getElementById("log").innerHTML;saveVault(true)}function saveVault(silent){let v={genesis:genesisId,personalCount:personalCount,chain:chain};let b=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});if(!silent){let u=URL.createObjectURL(b);let a=document.createElement("a");a.href=u;a.download="chain.json";a.click()}}function loadVault(){let f=document.getElementById("fileLoad").files[0];if(!f)return alert("pick chain.json");let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);chain=v.chain||[];personalCount=v.personalCount||chain.length;genesisId=v.genesis||genesisId;localStorage.setItem("pond_chain",JSON.stringify(chain));localStorage.setItem("pond_personal",personalCount);localStorage.setItem("pond_genesis",genesisId);refreshUni();renderChain(); chain.forEach(t=>{if(!t.btc||isNaN(t.uni)){t.btc=t.btc||113500; t.sun=t.sun||13216; t.uni=t.btc*1000+t.sun+t.you*10}}); localStorage.setItem("pond_chain",JSON.stringify(chain));catch(e){alert(e)}};r.readAsText(f)}loadLocal();refreshUni();fetchBtc();renderChain();setInterval(refreshUni,1000);setInterval(fetchBtc,60000);setInterval(drawPond,50);</script></body></html>
