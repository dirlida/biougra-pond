<!DOCTYPE html><html><body style=background:#000;color:#0f0;font-family:monospace;padding:20px><h2>BIOUGRA POND WORKS</h2><div id=u>test</div><button onclick=mint() style=background:#0f0;padding:15px>MINT ZERO</button><div id=log></div><script>let c=JSON.parse(localStorage.getItem("pond_chain")||"[]");let p=parseInt(localStorage.getItem("pond_personal")||"0")||c.length;function ref(){document.getElementById("u").innerText="YOU:"+p+" CHAIN:"+c.length+" TIME:"+new Date().toTimeString()}function mint(){p++;localStorage.setItem("pond_personal",p);let tx={id:"zero-"+Date.now(),you:p,ts:Date.now()};c.push(tx);localStorage.setItem("pond_chain",JSON.stringify(c));ref();document.getElementById("log").innerHTML+="<div>MINTED "+tx.id+"</div>"}ref();</script>
