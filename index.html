<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biougra Pond v12</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:10px;margin:0}#universal{font-size:16px;border:2px solid #0f0;padding:10px;margin-bottom:10px;word-break:break-all;white-space:pre-line}button{background:#0f0;color:#000;border:0;padding:12px;font-size:14px;font-weight:bold;margin:4px 2px}button.small{background:#111;color:#0f0;border:1px solid #0f0;padding:8px;font-size:11px}#log{font-size:11px}.tx{border:1px solid #0f0;padding:8px;margin:6px 0;word-break:break-all}#verify{border:2px dashed #0f0;padding:10px;margin-top:15px}input{width:95%;background:#111;color:#0f0;border:1px solid #0f0;padding:8px;margin:4px 0;font-family:monospace}</style></head><body><h2>🌵 Biougra Pond v12 - COINBASE LIVE</h2><div id="universal">loading...</div><button onclick="mintZero()">MINT ZERO</button><button onclick="exportChain()" class="small">EXPORT</button><button onclick="document.getElementById('fileIn').click()" class="small">IMPORT</button><input type="file" id="fileIn" style="display:none" onchange="importChain(this)"><button onclick="clearPond()" class="small" style="color:#f55;border-color:#f55">CLEAR</button><button onclick="fetchRealBtc()" class="small">REFRESH BTC</button><div id="log"></div><div id="verify"><h3>🔍 VERIFIER</h3><input id="verifyInput" placeholder="paste id"><button onclick="verifyTx()">VERIFY</button><div id="verifyOut" style="margin-top:8px;white-space:pre-line"></div></div><script>let chain=[];try{chain=JSON.parse(localStorage.getItem('pond_chain')||'[]')}catch(e){chain=[]}
let personalCount=parseInt(localStorage.getItem('pond_personal')||'0')||0;
let genesisId=localStorage.getItem('pond_genesis_id')||`wakha-alik-${Date.now()}`;localStorage.setItem('pond_genesis_id',genesisId);
let realBtc=83548,realBtcTime=0,realBtcSrc="fallback";let _a={btc:realBtc,sun:0,you:0};let universalBase=0;
async function fetchRealBtc(){let sources=[async()=>{let r=await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");let j=await r.json();return{price:Math.floor(parseFloat(j.data.amount)),src:"coinbase"}},async()=>{let r=await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");let j=await r.json();return{price:Math.floor(parseFloat(j.price)),src:"binance"}},async()=>{let r=await fetch("https://api.kraken.com/0/public/Ticker?pair=XBTUSD");let j=await r.json();return{price:Math.floor(parseFloat(j.result.XXBTZUSD.c[0])),src:"kraken"}}];for(let fn of sources){try{let res=await fn();if(res.price>1000){realBtc=res.price;realBtcTime=Date.now();realBtcSrc=res.src;_a.btc=realBtc;refreshUniversal();log(`BTC LIVE ${realBtc} ${realBtcSrc}`);return realBtc}}catch(e){log("try fail "+e.message)}}log(`BTC ${realBtc} ${realBtcSrc} (fallback)`);refreshUniversal();return realBtc;}
function refreshUniversal(){let d=new Date();let h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;_a.sun=Math.floor(Math.max(0,Math.sin((h-6)*Math.PI/12))*1000000);_a.you=chain.length+personalCount;_a.btc=realBtc;universalBase=_a.btc*1000+_a.sun+_a.you*10;document.getElementById('universal').innerText=`UNIVERSAL: ${universalBase}\nBTC:${_a.btc} (${realBtcSrc}) SUN:${_a.sun} YOU:${_a.you}\nID:${genesisId}`;}
function log(m){let el=document.getElementById('log');el.innerHTML=`<div>> ${m}</div>`+el.innerHTML}
function render(){document.getElementById('log').innerHTML=chain.slice(-10).reverse().map(x=>`<div class="tx">${x.id||x.slice(0,40)}</div>`).join('')}
async function mintZero(){personalCount++;localStorage.setItem('pond_personal',personalCount);let id=`zero-${Date.now()}-${Math.random().toString(36).slice(2)}`;chain.push({id,ts:Date.now(),base:universalBase});localStorage.setItem('pond_chain',JSON.stringify(chain));refreshUniversal();render();log(`MINTED ${id}`)}
function exportChain(){let b=new Blob([JSON.stringify(chain)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download=`pond-${Date.now()}.json`;a.click()}
function importChain(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{let j=JSON.parse(e.target.result);chain=j;localStorage.setItem('pond_chain',JSON.stringify(chain));render();refreshUniversal();log("IMPORTED")}catch(err){log("IMPORT FAIL")}};r.readAsText(f)}
function clearPond(){if(!confirm("clear?"))return;chain=[];localStorage.setItem('pond_chain','[]');render();refreshUniversal();log("CLEARED")}
function verifyTx(){let v=document.getElementById('verifyInput').value.trim();let out=document.getElementById('verifyOut');let f=chain.find(x=>x.id===v||(typeof x==="string"&&x.includes(v)));out.innerText=f?`FOUND:\n${JSON.stringify(f,null,2)}`:"NOT FOUND in this browser. Try IMPORT first."}
fetchRealBtc().finally(()=>{refreshUniversal();render();});setInterval(fetchRealBtc,30000);
</script></body></html>
