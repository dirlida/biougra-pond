<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POND://biougra v24 FOREVER</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:12px}
button{padding:14px 18px;background:#0f0;color:#000;font-weight:bold;border:0;border-radius:10px;font-size:16px}
#log{white-space:pre-wrap;margin-top:12px;line-height:1.4}
.small{color:#888}
</style>
</head>
<body>
🌊 POND://biougra v24 FOREVER SSH — Fish+GPS unified, no tokens
<div id="stats"></div>
<button id="mintBtn">MINT YOU 🎣📍 ONE BUTTON</button> <button onclick="downloadPending()">Download pending.json</button> <button onclick="clearPending()">Clear Pending</button> <button onclick="alert('Termux: ./sync.sh')">Sync hint</button>
<div id="log"></div>
<script>
let chain=[]
let pending=[]
const FALLBACK={lat:30.13,lon:-9.38,city:"Tinkourri"}
function load(){
  try{ chain=JSON.parse(localStorage.getItem('pond_chain')||'[]') }catch(e){chain=[]}
  try{ pending=JSON.parse(localStorage.getItem('pond_pending')||'[]') }catch(e){pending=[]}
}
function save(){
  localStorage.setItem('pond_chain', JSON.stringify(chain))
  localStorage.setItem('pond_pending', JSON.stringify(pending))
}
async function fetchRemote(){
  try{
    const r=await fetch('./chain.json?'+Date.now())
    if(r.ok){ const remote=await r.json(); if(remote.length>chain.length) chain=remote; }
  }catch(e){}
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h.toString(16).padStart(8,'0').slice(0,8)}
function render(){
  const total=chain.length+pending.length
  document.getElementById('stats').innerHTML=`Fish:${total} GPS:${total} Total:${total} | Pending:${pending.length} | <span class=small>local-only v24 FOREVER no 401</span>`
  let out=''
  const all=[...chain,...pending].slice(-50).reverse()
  all.forEach((b,i)=>{
    const idx=total - i
    const lat=b.lat.toFixed(2), lon=b.lon.toFixed(2)
    out+=`#${idx} ${b.id} btc:${b.btc} sun:${b.sun}K 🌖 | [${lat},${lon}]#${b.h} ${b.city} rise${b.rise}\n`
  })
  document.getElementById('log').textContent=out
}
function getGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(FALLBACK)
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lon:p.coords.longitude,city:"Tinkourri"}),
      _=>res(FALLBACK),
      {enableHighAccuracy:true,timeout:8000,maximumAge:0}
    )
  })
}
async function doMint(){
  const btn=document.getElementById('mintBtn'); btn.textContent='⏳ GPS...'
  const pos=await getGPS()
  const now=Date.now()
  const btc=Math.floor(80000+Math.random()*5000)
  const sun=16000
  const id=`zero-${now}`
  const h=hash(id+pos.lat+pos.lon)
  const block={id,btc,sun,lat:pos.lat,lon:pos.lon,h,city:pos.city,rise:"6.81",ts:now}
  pending.push(block)
  save(); render()
  btn.textContent='MINT YOU 🎣📍 ONE BUTTON'
  autoDownload()
}
function autoDownload(){
  const blob=new Blob([JSON.stringify(pending,null,2)],{type:'application/json'})
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pond-pending.json'; a.click()
}
function downloadPending(){ autoDownload() }
function clearPending(){localStorage.removeItem('pond_pending');location.reload()}
function syncHint(){ alert("In Termux:\ncd ~/biougra-pond\n./sync.sh\nIt merges Downloads/pond-pending.json and pushes via SSH forever key. No token.") }
(async()=>{
  load(); await fetchRemote(); render();
  document.getElementById('mintBtn').onclick=doMint
})()
</script>
</body>
</html>
