async function sha256(data) {
  const enc = new TextEncoder().encode(typeof data === 'string'? data : JSON.stringify(data));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
class PondKernel {
  async doubleSha(data) { const h1 = await sha256(data); return await sha256(h1); }
  async generateHashWallet() {
    const seed = crypto.getRandomValues(new Uint8Array(32));
    const seedHex = Array.from(seed).map(b=>b.toString(16).padStart(2,'0')).join('');
    const pub = await this.doubleSha(seedHex + "|POND_ORIGIN_1%");
    return { seed: seedHex, pubHash: pub, type: "SLH-DSA-like hash wallet" };
  }
  async stamp({gps, sun, moon, btcHeight, skyOrSoundOrWitness, seriousness=1}) {
    const payload = { gps, sun, moon, btcHeight, skyOrSoundOrWitness, seriousness, ts: Date.now() };
    const hash = await this.doubleSha(JSON.stringify(payload));
    return { hash, btcHeight, seriousness, type: "presence" };
  }
  async verifySkyBrightness(s){ return { valid:true, path:"SKY", confidence:0.92 }; }
  async verifySound(s){ return { valid:true, path:"SOUND", confidence:0.89 }; }
  async verifyWitness(w){ return { valid:w.length>=1, path:"WITNESS", confidence:0.95 }; }
  async quantumBouncerVerifyBatch(stamps){
    const results=[];
    for(const s of stamps){
      let r; if(s.skyOrSoundOrWitness?.includes('sky')) r=await this.verifySkyBrightness(s);
      else if(s.skyOrSoundOrWitness?.includes('sound')) r=await this.verifySound(s);
      else r=await this.verifyWitness([s]);
      results.push({ stamp:s.hash?.slice(0,16),...r, bouncer:"classical_today_quantum_tomorrow" });
    }
    return results;
  }
  calculateOriginTax(amount){ return amount*0.01; }
}
