<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biougra Pond v19 Market Peek</title>
<style>
body{background:#001a12;color:#0f3;font-family:monospace;padding:12px}
#market-bar{display:flex;flex-wrap:wrap;gap:12px;padding:10px;border:1px dashed #0f3;background:#002a1a;margin-bottom:12px}
button{background:#0f3;color:#001a12;border:none;padding:8px 14px;font-weight:bold;cursor:pointer}
#chain{max-height:200px;overflow:auto;border:1px solid #0f3;padding:8px;margin-top:12px}
.fish{padding:2px 0;border-bottom:1px dotted #0f3}
</style>
</head>
<body>
<div id="market-bar">
  <span>🌊 POND://biougra</span>
  <span id="ocean">Ocean:...</span>
  <span id="you-count">You:...</span>
  <button id="copyPond">Copy Pond Link</button>
</div>

<h2>Biougra Pond v19</h2>
<div>BTC: <span id="btc">loading</span> | SUN: <span id="sun">...</span> | YOU: <span id="you">...</span></div>
<canvas id="pond" width="360" height="200" style="border:1px solid #0f3;margin:12px 0;background:#003322"></canvas><br>
<button id="mint">MINT YOU FISH 🎣</button>

<div id="chain"></div>

<script>
const GENESIS = "wakha-1790774019487";
const RAW = "https://raw.githubusercontent.com/dirlida/biougra-pond/main/chain.json";

async function loadChain(){
  try{
    const r = await fetch(RAW+"?v="+Date.now());
    const t = await r.text();
    if(t.includes('}{')) throw new Error('corrupted double JSON detected');
    const j = JSON.parse(t);
    if(!j.chain) throw new Error('no chain field');
    console.log('from github', j.personalCount);
    return j;
  }catch(e){
    console.warn('github fail, local', e.message);
    const l = localStorage.getItem('wakha-chain');
    if(l) return JSON.parse(l);
    return {genesis:GENESIS, personalCount:0, chain:[]};
  }
}
function saveChain(o){
  const txt = JSON.stringify(o,null,2);
  if(txt.includes('}{')){ alert('BLOCKED corrupt save'); return; }
  localStorage.setItem('wakha-chain', txt);
  const blob = new Blob([txt],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chain.json';
  a.click();
}
let state;
async function init(){
  state = await loadChain();
  document.getElementById('you-count').textContent = 'You: '+state.personalCount;
  document.getElementById('ocean').textContent = 'Ocean: '+state.personalCount+' fish';
  document.getElementById('you').textContent = state.personalCount;
  renderChain();
  setInterval(()=>{
    const now = Date.now();
    const sun = Math.floor((now % 86400000)/5400);
    document.getElementById('sun').textContent = sun;
    document.getElementById('btc').textContent = 83934 + Math.floor(Math.random()*200);
  },2000);
}
function renderChain(){
  const c = document.getElementById('chain');
  c.innerHTML = state.chain.slice(-20).reverse().map(f=>`<div class="fish">#${f.you} ${f.id} btc:${f.btc||'-'} sun:${f.sun||'-'}</div>`).join('');
}
document.getElementById('mint').onclick = ()=>{
  const id = 'zero-'+Date.now();
  const fish = {id, you: state.personalCount+1, ts: Date.now(), btc: 83934, sun: 15637, uni: 83949797+state.personalCount};
  state.chain.push(fish);
  state.personalCount++;
  saveChain(state);
  renderChain();
  document.getElementById('you-count').textContent = 'You: '+state.personalCount;
  document.getElementById('ocean').textContent = 'Ocean: '+state.personalCount+' fish';
};
document.getElementById('copyPond').onclick = ()=>{
  const link = location.origin + location.pathname + '?pond=biougra&genesis='+GENESIS;
  navigator.clipboard.writeText(link);
  alert('Copied: '+link);
};
init();
</script>
</body>
</html>
