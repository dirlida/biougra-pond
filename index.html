<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">

<div class="card">

<h2>Biougra Pond Node</h2>

<p style="font-size:12px;color:#666">gps metadata only: 30.07,-9.62 - any phone can verify<br>hash: f83c70e14a1e5e17<br>hmac: 389b19b95379fc19...<br>bell: 3f0a3bf51e179e19</p>
<button onclick="share()">Share QR</button>

<script>
fetch('wallet.json').then(r=>r.json()).then(w=>{
 document.getElementById('s').innerText=w.proof.S_measured;
 document.getElementById('bal').innerText=w.balance;

function share(){ 
 if(navigator.share){ navigator.share({title:'Biougra Pond',url:location.href}) }
 else{ prompt('Share this link:', location.href) }
}
</script>
